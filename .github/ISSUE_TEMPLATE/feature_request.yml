name: Feature request
description: Suggest an idea
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can't you do today? What is annoying?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: What should change, concretely?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the README and existing issues first.
          required: false
