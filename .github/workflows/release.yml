name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned shellcheck (match local dev version)
        run: |
          curl -sSL -o /tmp/sc.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.8.0/shellcheck-v0.8.0.linux.x86_64.tar.xz
          echo "ab6ee1b178f014d1b86d1e24da20d1139656c8b0ed34d2867fbb834dad02bf0a  /tmp/sc.tar.xz" | sha256sum --check -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install -m755 /tmp/shellcheck-v0.8.0/shellcheck /usr/local/bin/shellcheck

      - name: Smoke tests (no skips allowed in CI)
        env:
          CI: 'true'
        run: ./test.sh

      - name: Validate plugin + marketplace manifests
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.270
          claude plugin validate .

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tag version must match plugin.json and marketplace.json
        run: |
          V="${GITHUB_REF_NAME#v}"
          J=$(jq -r .version .claude-plugin/plugin.json)
          M=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          if [ "$V" != "$J" ] || [ "$V" != "$M" ]; then
            echo "tag $GITHUB_REF_NAME does not match plugin.json version $J / marketplace.json version $M" >&2
            exit 1
          fi

      - name: Create GitHub Release with CHANGELOG notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v pat="^## $V" '$0 ~ pat {f=1; next} /^## /{f=0} f' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "CHANGELOG.md has no '## $V' section — add release notes before tagging" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$NOTES"
